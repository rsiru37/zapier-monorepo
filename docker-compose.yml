services:

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
  
  create-topics:
    image: apache/kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating topics...'
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic zap-events --bootstrap-server kafka:9092 
      "
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  db-migrate:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.migrations
    # command: sh -c "bun run db:migrate"
    depends_on:
      postgres:
        condition: service_healthy

  primary_backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.primary_backend
    ports:
      - "3000:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  hooks:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.hooks
    ports:
      - "3002:3002"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  processor:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.processor
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
  
  worker:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.worker
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
  
  web:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.web
    ports:
      - "3001:3001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
  

volumes:
  postgres_data: