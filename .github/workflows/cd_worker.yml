name: CD - Worker (Docker Hub)

on:
  push:
    branches:
      - main           

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.primary_backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/zap-worker:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/zap-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2 (docker-compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd zapier-monorepo         
            docker compose pull cryptingle/zap-worker
            docker compose up -d --no-deps --force-recreate worker
            docker compose ps worker